services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seoqa
      POSTGRES_PASSWORD: seoqa
      POSTGRES_DB: seoqa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seoqa -d seoqa"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      DATABASE_URL: postgres://seoqa:seoqa@db:5432/seoqa
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
