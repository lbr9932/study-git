{{#> layouts/base
  title=title
  description=description
  canonical=canonical
  ogType=ogType
  bodyClass="search-page"
}}
  <section class="page-hero">
    <p class="eyebrow">Search</p>
    <h1>Search articles</h1>
    <p class="lead">Search stays lightweight and keyboard-friendly from the start.</p>
  </section>

  <section class="section">
    <form class="search-form" role="search">
      <label class="sr-only" for="search-query">Search query</label>
      <input id="search-query" class="search-form__input" type="search" placeholder="Search by title, tag, or summary" />
      <button class="button button--primary" type="submit">Search</button>
    </form>
  </section>
{{/layouts/base}}
